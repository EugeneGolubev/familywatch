<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FamilyWatch</title>
  <script src="https://unpkg.com/htmx.org@1.9.12"></script>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen">
  <nav class="border-b border-slate-800 p-4 flex gap-4">
    <a href="/" class="font-bold">FamilyWatch</a>
    <a href="/catalog/search/">Search</a>
    <a href="/lists/mine/">My List</a>
    <a href="/lists/household/">Household List</a>
    <span class="ml-auto"></span>
    {% if user.is_authenticated %}
      <span>{{ user.username }}</span>
      <form action="{% url 'logout' %}" method="post">{% csrf_token %}<button>Logout</button></form>
    {% else %}
      <a href="{% url 'login' %}">Login</a>
      <a href="{% url 'register' %}">Register</a>
    {% endif %}
  </nav>
  <main class="max-w-5xl mx-auto p-6">
    {% block content %}{% endblock %}
  </main>
</body>
</html>
