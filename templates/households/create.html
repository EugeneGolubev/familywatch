{% extends "base.html" %}
{% block content %}
<h1 class="text-2xl font-bold mb-4">Create household</h1>
<form method="post" class="space-y-4 max-w-md">
  {% csrf_token %}
  {{ form.as_p }}
  <div class="flex gap-3">
    <button class="px-4 py-2 bg-blue-600 rounded">Create household</button>
    <a href="{% url 'household_dashboard' %}" class="px-4 py-2 border border-slate-700 rounded">Cancel</a>
  </div>
</form>
{% endblock %}
